<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${mode == 'edit' ? '書籍編集' : '書籍登録'})}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1 th:text="${mode == 'edit'} ? '書籍編集' : '書籍登録'">書籍登録</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <div class="card">
        <!-- 登録と編集で送信先を切り替える -->
        <form th:action="${mode == 'edit'} ? @{/books/{id}/edit(id=${bookId})} : @{/books/new}"
              th:object="${bookForm}" method="post">
            <div class="field">
                <label for="title">タイトル</label>
                <input type="text" id="title" th:field="*{title}">
                <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="field">
                <label for="author">著者</label>
                <input type="text" id="author" th:field="*{author}">
                <div class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
            </div>
            <div class="field">
                <label for="isbn">ISBN（13桁）</label>
                <input type="text" id="isbn" th:field="*{isbn}">
                <div class="error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
            </div>
            <div class="field">
                <label for="publishedYear">出版年</label>
                <input type="number" id="publishedYear" th:field="*{publishedYear}">
                <div class="error" th:if="${#fields.hasErrors('publishedYear')}" th:errors="*{publishedYear}"></div>
            </div>
            <button type="submit" class="btn" th:text="${mode == 'edit'} ? '更新する' : '登録する'">登録する</button>
            <a class="btn btn-sub" th:href="@{/books}">戻る</a>
        </form>
    </div>
</main>
</body>
</html>
