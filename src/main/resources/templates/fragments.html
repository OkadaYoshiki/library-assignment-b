<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 各画面で共通して使う部品（フラグメント） -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title} + ' | 図書貸出管理'">図書貸出管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header th:fragment="header">
    <a class="logo" th:href="@{/}">📚 図書貸出管理</a>
    <nav>
        <a th:href="@{/books}">書籍</a>
        <a th:href="@{/members}">会員</a>
        <a th:href="@{/loans}">貸出中</a>
        <a th:href="@{/loans/overdue}">延滞</a>
    </nav>
</header>

<div th:fragment="messages">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>

</body>
</html>
