spring.application.name=library-app

# ===== MySQL 接続設定 =====
# docker compose up -d で起動したMySQLに接続する設定です。
# 自分で用意したMySQLを使う場合はURL・ユーザー名・パスワードを書き換えてください。
spring.datasource.url=jdbc:mysql://localhost:3306/library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=library
spring.datasource.password=library

# ===== JPA 設定 =====
# create : 起動のたびにテーブルを作り直す（教材用。データは毎回初期状態に戻ります）
# 作ったデータを残したい場合は update に変更し、下の spring.sql.init.mode を never にしてください。
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# テーブル作成後に data.sql（初期データ）を流す
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
